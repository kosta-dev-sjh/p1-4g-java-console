    <link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        
        .cursor-blink {
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: #39FF14;
            margin-left: 10px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        
        .anim-item {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .anim-item.visible {
            opacity: 1;
            transform: translate(0, 0);
        }
        
        .anim-item.visible.hovered {
            transform: translateX(20px);
        }
        
        .goal-item-bg {
            background-color: rgba(20, 20, 20, 0.9);
            border: 2px solid #333333;
            border-radius: 4px;
        }
        
        .goal-item-bg.visible.hovered {
            border-color: #39FF14;
            background-color: rgba(30, 30, 30, 0.95);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.15);
            z-index: 5;
        }
        
        .goal-item-bg .progress-deco {
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 4px;
            background-color: #39FF14;
            width: 0%;
            transition: width 0.5s ease-out;
        }
        
        .goal-item-bg.visible.hovered .progress-deco {
            width: 100%;
        }
        
        .goal-item-bg .pixel-corner {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FFFFFF;
            transition: background-color 0.3s;
        }
        
        .goal-item-bg.visible.hovered .pixel-corner {
            background-color: #39FF14;
        }
        
        .pc-tl {
            top: -2px;
            left: -2px;
        }
        
        .pc-tr {
            top: -2px;
            right: -2px;
        }
        
        .pc-bl {
            bottom: -2px;
            left: -2px;
        }
        
        .pc-br {
            bottom: -2px;
            right: -2px;
        }
        
        .goal-item-num p {
            transition: color 0.3s, text-shadow 0.3s;
        }
        
        .goal-item-num.visible.hovered p {
            color: #39FF14 !important;
            text-shadow: 0 0 10px #39FF14;
        }
        
        .goal-item-num.visible.hovered {
            z-index: 15;
        }
        
        .goal-item-txt.visible.hovered {
            z-index: 15;
        }
        
        .goal-item-icn {
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .goal-item-icn.hovered {
            opacity: 1;
            transform: translateX(20px);
            z-index: 15;
        }
        
        .goal-item-icn i {
            transition: color 0.3s;
        }
        
        .goal-item-icn.hovered i {
            color: #FEF08A !important;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const titleText = "프로젝트 기대효과";
            const titleElement = document.getElementById('pageTitleText');
            titleElement.innerHTML = '<span class="cursor-blink"></span>';
            let charIndex = 0;

            function typeWriter() {
                if (charIndex < titleText.length) {
                    const currentText = titleText.substring(0, charIndex + 1);
                    titleElement.innerHTML = currentText + '<span class="cursor-blink"></span>';
                    charIndex++;
                    setTimeout(typeWriter, 100);
                } else {
                    for (let i = 1; i <= 5; i++) {
                        setTimeout(() => {
                            document.getElementById('item-bg-' + i).classList.add('visible');
                            document.getElementById('item-num-' + i).classList.add('visible');
                            document.getElementById('item-txt-' + i).classList.add('visible');
                        }, (i - 1) * 250);
                    }
                }
            }
            setTimeout(typeWriter, 500);

            for (let i = 1; i <= 5; i++) {
                const bg = document.getElementById('item-bg-' + i);
                const num = document.getElementById('item-num-' + i);
                const txt = document.getElementById('item-txt-' + i);
                const icn = document.getElementById('item-icn-' + i);

                const group = [bg, num, txt, icn];

                const addHover = () => group.forEach(el => el.classList.add('hovered'));
                const rmHover = () => group.forEach(el => el.classList.remove('hovered'));

                group.forEach(el => {
                    el.addEventListener('mouseenter', addHover);
                    el.addEventListener('mouseleave', rmHover);
                });
            }
        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowRight") {
                window.location.href = "9.html";
            }
        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                window.location.href = "7.html";
            }
        });
    </script>
