<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shell Hero - Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Noto+Sans+KR:wght@500;700;900&amp;display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        
        .typing-cursor::after {
            content: ' ';
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: #39FF14;
            vertical-align: bottom;
            margin-left: 10px;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 10px #39FF14;
        }
        
        .blink-text {
            animation: blink 1.5s step-end infinite;
        }
    </style>
</head>

<body>
    <div class="slide-container" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background-color: #050505;">
        <!-- Background Grid -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-image: url(&quot;data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a1a' fill-opacity='1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E&quot;); opacity: 0.3; z-index: 1;"></div>
        <!-- Scanlines -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-image: url(&quot;data:image/svg+xml,%3Csvg width='1' height='4' viewBox='0 0 1 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='2' width='1' height='2' fill='%23000' opacity='0.3'/%3E%3C/svg%3E&quot;); z-index: 1; pointer-events: none;"></div>
        <!-- Pixel Corner Top-Left -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 60px; top: 60px; width: 40px; height: 40px; border-top: 4px solid #39FF14; border-left: 4px solid #39FF14; box-shadow: -4px -4px 10px rgba(57,255,20,0.5); z-index: 1;"></div>
        <!-- Pixel Corner Top-Right -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 1820px; top: 60px; width: 40px; height: 40px; border-top: 4px solid #39FF14; border-right: 4px solid #39FF14; box-shadow: 4px -4px 10px rgba(57,255,20,0.5); z-index: 1;"></div>
        <!-- Pixel Corner Bottom-Left -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 60px; top: 980px; width: 40px; height: 40px; border-bottom: 4px solid #39FF14; border-left: 4px solid #39FF14; box-shadow: -4px 4px 10px rgba(57,255,20,0.5); z-index: 1;"></div>
        <!-- Pixel Corner Bottom-Right -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 1820px; top: 980px; width: 40px; height: 40px; border-bottom: 4px solid #39FF14; border-right: 4px solid #39FF14; box-shadow: 4px 4px 10px rgba(57,255,20,0.5); z-index: 1;"></div>
        <!-- Top Deco Line -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 192px; top: 260px; width: 1536px; height: 2px; background-color: #39FF14; box-shadow: 0 0 10px #39FF14; z-index: 1;"></div>
        <!-- Main Title -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; left: 0px; top: 330px; width: 1920px; height: 120px; z-index: 10;">
            <p style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 80px; font-weight: 900; color: #FFFFFF; text-shadow: 6px 6px 0px #333333, 0 0 20px rgba(57,255,20,0.6); text-align: center; letter-spacing: -2px;">Shell Hero<span class="typing-cursor"></span></p>
        </div>
        <!-- Subtitle -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; left: 0px; top: 480px; width: 1920px; height: 60px; z-index: 10;">
            <p style="margin: 0; font-family: 'Press Start 2P', 'Noto Sans KR', monospace; font-size: 32px; font-weight: 700; color: #BFDBFE; text-shadow: 3px 3px 0px #333333; text-align: center; letter-spacing: 2px;">Java Console RPG Final Presentation</p>
        </div>
        <!-- Team Info Background Shape -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 585px; top: 620px; width: 750px; height: 80px; background-color: rgba(0, 0, 0, 0.7); border: 1px solid #444444; z-index: 1;"></div>
        <!-- Team Info Text -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; left: 585px; top: 620px; width: 750px; height: 80px; z-index: 10;">
            <p style="margin: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 22px; font-weight: 700; text-align: center; line-height: 80px; letter-spacing: 1px;">
                <span style="color: #BFDBFE; font-family: 'Press Start 2P', monospace; font-size: 20px; margin-right: 20px;">TEAM 4G</span>
                <span style="color: #FFFFFF;">송정현 · 홍준화 · 이진주 · 김재민</span>
            </p>
        </div>
        <!-- Start Prompt (Blinking) -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; left: 0px; top: 780px; width: 1920px; height: 50px; z-index: 10;">
            <p class="blink-text" style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 24px; font-weight: 700; color: #39FF14; text-align: center; text-transform: uppercase; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);">&gt; PRESS ANY KEY TO START FINAL BUILD_</p>
        </div>
        <!-- Bottom Deco Line -->
        <div data-object="true" data-object-type="shape" style="position: absolute; left: 192px; top: 900px; width: 1536px; height: 2px; background-color: #39FF14; box-shadow: 0 0 10px #39FF14; z-index: 1;"></div>
    </div>
</body>
<script>
    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowRight") {
            window.location.href = "2.html";
        }
    });
</script>

</html>
