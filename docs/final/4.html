<!DOCTYPE html>
<html lang="ko" data-theme="light" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Shell Hero - Team Name</title>
    <link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        
        .slide-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        
        .cursor-blink {
            display: inline-block;
            width: 12px;
            height: 36px;
            background-color: #39FF14;
            margin-left: 8px;
            vertical-align: sub;
            animation: blink 1s step-end infinite;
        }
        
        .scale-in {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .scale-in.active {
            opacity: 1;
            transform: scale(1);
        }
        
        .fade-slide-up {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .fade-slide-up.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body style="">
    <div class="slide-container">
        <!-- Background Grid Pattern -->
        <div data-object="true" data-object-type="shape" style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background-image: url(&quot;data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a1a' fill-opacity='1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E&quot;); opacity: 0.3; z-index: 1; pointer-events: none;"></div>
        <!-- Background Scanlines -->
        <div data-object="true" data-object-type="shape" style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background-image: url(&quot;data:image/svg+xml,%3Csvg width='1' height='4' viewBox='0 0 1 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='2' width='1' height='2' fill='%23000' opacity='0.3'/%3E%3C/svg%3E&quot;); z-index: 1; pointer-events: none;"></div>
        <!-- Slogan Text -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; top: 180px; left: 260px; width: 1400px; height: 120px; text-align: center; z-index: 10;">
            <p id="sloganText" style="font-size: 42px; font-weight: 800; color: #FFFFFF; background-color: #050505; padding: 15px 40px; border: 2px solid #FFFFFF; display: inline-block; box-shadow: 8px 8px 0 rgba(255, 255, 255, 0.2); font-family: 'Paperlogy', 'Noto Sans KR', sans-serif; margin: 0;">4개의 힘이 모여 거대한 변화를 만듭니다<span class="cursor-blink"></span></p>
        </div>
        <!-- Main Team Name -->
        <div data-object="true" data-object-type="textbox" style="position: absolute; top: 380px; left: 0px; width: 1920px; height: 350px; text-align: center; z-index: 10;">
            <p class="scale-in active" id="teamName" style="font-family: 'Press Start 2P', monospace; font-size: 250px; font-weight: 900; line-height: 1.2; color: #050505; -webkit-text-stroke: 6px #39FF14; text-shadow: 15px 15px 0px #BFDBFE; margin: 0; letter-spacing: 10px;">4G</p>
        </div>
        <!-- Reason Box Background -->
        <div class="fade-slide-up active" data-object="true" data-object-type="shape" id="reasonBoxBg" style="position: absolute; top: 780px; left: 460px; width: 1000px; height: 160px; background-color: rgba(10, 10, 10, 0.9); border: 4px solid #39FF14; box-shadow: 0 0 40px rgba(57, 255, 20, 0.15); z-index: 5;"></div>
        <!-- Reason Box Title Badge -->
        <div class="fade-slide-up active" data-object="true" data-object-type="textbox" id="reasonBoxTitle" style="position: absolute; top: 756px; left: 490px; width: 450px; height: 34px; z-index: 10;">
            <p style="background-color: #050505; color: #39FF14; padding: 5px 20px; font-family: 'Press Start 2P', monospace; font-size: 16px; border: 2px solid #39FF14; border-bottom: none; margin: 0; display: inline-block;">SYSTEM_MSG: TEAM_IDENTITY</p>
        </div>
        <!-- Reason Box Content Text -->
        <div class="fade-slide-up active" data-object="true" data-object-type="textbox" id="reasonBoxText" style="position: absolute; top: 830px; left: 510px; width: 900px; height: 100px; text-align: center; z-index: 10;">
            <p style="font-size: 36px; line-height: 1.6; color: #FFFFFF; font-weight: 500; font-family: 'Paperlogy', 'Noto Sans KR', sans-serif; margin: 0;">팀원 이름의 각 공통 자음 '<span style="color: #FEF08A; font-weight: 900; font-size: 1.2em; text-shadow: 0 0 10px #FEF08A;">ㅈ</span>' 4개가 모여서 연출</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sloganContent = "4개의 힘이 모여 거대한 변화를 만듭니다";
            const sloganElement = document.getElementById('sloganText');
            const teamNameElement = document.getElementById('teamName');
            const reasonElements = document.querySelectorAll('.fade-slide-up');

            let charIndex = 0;

            function typeSlogan() {
                if (charIndex < sloganContent.length) {
                    const currentText = sloganContent.substring(0, charIndex + 1);
                    sloganElement.innerHTML = currentText + '<span class="cursor-blink"></span>';
                    charIndex++;
                    setTimeout(typeSlogan, 90);
                } else {
                    setTimeout(() => {
                        teamNameElement.classList.add('active');

                        setTimeout(() => {
                            reasonElements.forEach(el => el.classList.add('active'));
                        }, 700);
                    }, 400);
                }
            }

            setTimeout(typeSlogan, 600);
        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowRight") {
                window.location.href = "5.html";
            }
        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                window.location.href = "3.html";
            }
        });
    </script>

</body>

</html>
