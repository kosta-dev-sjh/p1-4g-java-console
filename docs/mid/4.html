<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shell Hero - Team Name</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --neon-green: #39FF14;
            --pastel-yellow: #FEF08A;
            --pastel-blue: #BFDBFE;
            --bg-black: #050505;
            --text-white: #FFFFFF;
            --dim-gray: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: 'Paperlogy', sans-serif;
            color: var(--text-white);
        }

        /* 배경 패턴 */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a1a' fill-opacity='1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
            z-index: 0;
        }

        .bg-scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='1' height='4' viewBox='0 0 1 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='2' width='1' height='2' fill='%23000' opacity='0.3'/%3E%3C/svg%3E");
            z-index: 1;
            pointer-events: none;
        }

        .container-frame {
            position: relative;
            width: 1920px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 팀명 (4G) 스타일 */
        .team-name-wrapper {
            position: relative;
            z-index: 5;
            margin-bottom: 60px;
        }

        .team-name-huge {
            font-family: 'Press Start 2P', monospace;
            font-size: 350px;
            font-weight: 900;
            line-height: 1;
            color: var(--bg-black);
            -webkit-text-stroke: 6px var(--neon-green);
            text-shadow: 15px 15px 0px var(--pastel-blue);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .team-name-huge.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 슬로건 스타일 */
        .slogan-container {
            position: absolute;
            top: 150px; /* 4G 위쪽 */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .slogan-text {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-white);
            background-color: var(--bg-black);
            padding: 15px 40px;
            border: 2px solid var(--text-white);
            display: inline-block;
            box-shadow: 8px 8px 0 rgba(255, 255, 255, 0.2);
            opacity: 0; /* 타이핑 전 숨김 */
        }

        /* 선정 이유 박스 스타일 */
        .reason-box {
            margin-top: 40px;
            width: 1000px;
            background-color: rgba(10, 10, 10, 0.9);
            border: 4px solid var(--neon-green);
            padding: 50px;
            position: relative;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.15);
            opacity: 0;
            transform: translateY(100px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .reason-box::before {
            content: "SYSTEM_MSG: TEAM_IDENTITY_ANALYSIS";
            position: absolute;
            top: -24px;
            left: 30px;
            background-color: var(--bg-black);
            color: var(--neon-green);
            padding: 5px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            border: 2px solid var(--neon-green);
            border-bottom: none;
        }

        .reason-text {
            font-size: 36px;
            line-height: 1.6;
            color: var(--text-white);
            text-align: center;
            font-weight: 500;
        }

        .highlight-text {
            color: var(--pastel-yellow);
            font-weight: 900;
            font-size: 1.2em;
            text-shadow: 0 0 10px var(--pastel-yellow);
        }

        /* 커서 */
        .cursor-blink {
            display: inline-block;
            width: 12px;
            height: 36px;
            background-color: var(--neon-green);
            margin-left: 8px;
            vertical-align: sub;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 글리치 애니메이션 */
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            10% { transform: skew(-5deg); }
            20% { transform: skew(5deg); }
            30% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        .glitch-anim {
            animation: glitch-skew 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-scanlines"></div>
<div class="container-frame">
<!-- 슬로건 (상단 배치) -->
<div class="slogan-container">
<p class="slogan-text" id="sloganText"></p>
</div>
<!-- 메인 팀명 -->
<div class="team-name-wrapper">
<h1 class="team-name-huge" id="teamName">4G</h1>
</div>
<!-- 선정 이유 박스 -->
<div class="reason-box" id="reasonBox">
<p class="reason-text">
                팀원 이름의 각 공통 자음 
                '<span class="highlight-text">ㅈ</span>' 
                4개가 모여서 연출
            </p>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sloganContent = "국내 통신 문화 혁신의 시작";
            const sloganElement = document.getElementById('sloganText');
            const teamNameElement = document.getElementById('teamName');
            const reasonBox = document.getElementById('reasonBox');

            // 1. 슬로건 타이핑 먼저 (타이틀 역할)
            sloganElement.style.opacity = '1';
            let charIndex = 0;
            
            function typeSlogan() {
                if (charIndex < sloganContent.length) {
                    const currentText = sloganContent.substring(0, charIndex + 1);
                    sloganElement.innerHTML = currentText + '<span class="cursor-blink"></span>';
                    charIndex++;
                    setTimeout(typeSlogan, 100);
                } else {
                    // 2. 팀명 거대하게 등장
                    setTimeout(() => {
                        teamNameElement.classList.add('active');
                        
                        // 3. 선정 이유 박스 슬라이드 업 (본문 역할)
                        setTimeout(() => {
                            reasonBox.style.opacity = '1';
                            reasonBox.style.transform = 'translateY(0)';
                        }, 800);
                    }, 500);
                }
            }
            
            // 시작 딜레이
            setTimeout(typeSlogan, 500);
        });
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") {
        window.location.href = "5.html";
    }
});
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                window.location.href = "3.html";
            }
        });
    </script>
</body>
</html>
