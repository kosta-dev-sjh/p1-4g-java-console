<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shell Hero - Ending</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        :root {
            --neon-green: #39FF14;
            --pastel-yellow: #FEF08A;
            --pastel-blue: #BFDBFE;
            --neon-red: #FF3131;
            --bg-black: #050505;
            --text-white: #FFFFFF;
            --border-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: 'Paperlogy', sans-serif;
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1920px;
            height: 1080px;
        }

        /* 배경 패턴 */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a1a' fill-opacity='1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
            z-index: 0;
        }

        .bg-scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='1' height='4' viewBox='0 0 1 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='2' width='1' height='2' fill='%23000' opacity='0.3'/%3E%3C/svg%3E");
            z-index: 1;
            pointer-events: none;
        }

        /* 컨테이너 */
        .container-frame {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 메인 질문 텍스트 */
        .question-box {
            margin-bottom: 80px;
            text-align: center;
        }

        .question-text {
            font-size: 80px;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 4px 4px 0 #333;
            margin: 0;
            line-height: 1.2;
        }

        .cursor-blink {
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: var(--neon-green);
            margin-left: 10px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 버튼 그룹 */
        .button-group {
            display: flex;
            gap: 100px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
        }

        .button-group.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 8비트 픽셀 버튼 스타일 */
        .pixel-btn {
            position: relative;
            display: inline-block;
            font-family: 'Press Start 2P', 'Paperlogy', monospace;
            font-size: 40px;
            font-weight: 700;
            color: var(--neon-green);
            background-color: transparent;
            padding: 20px 60px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            outline: none;
            /* CSS box-shadow를 이용한 픽셀 테두리 효과 */
            box-shadow: 
                -4px 0 0 0 var(--neon-green),
                4px 0 0 0 var(--neon-green),
                0 -4px 0 0 var(--neon-green),
                0 4px 0 0 var(--neon-green);
            margin: 4px; /* 테두리 공간 확보 */
            transition: transform 0.1s;
        }

        /* 버튼 내부 채움 효과 (hover 시) */
        .pixel-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--neon-green);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .pixel-btn:hover {
            color: #000;
            transform: translateY(4px);
            /* 눌렸을 때 그림자 조정 */
            box-shadow: 
                -4px 0 0 0 var(--neon-green),
                4px 0 0 0 var(--neon-green),
                0 -4px 0 0 var(--neon-green),
                0 4px 0 0 var(--neon-green),
                0 0 20px var(--neon-green); /* Glow 효과 추가 */
        }

        .pixel-btn:hover::after {
            opacity: 1;
        }

        /* '네' 버튼 (종료) 스타일 - 기본 초록 */
        
        /* '처음으로' 버튼 스타일 - 약간 다른 포인트 (파스텔 블루) */
        .pixel-btn.restart {
            color: var(--pastel-blue);
            box-shadow: 
                -4px 0 0 0 var(--pastel-blue),
                4px 0 0 0 var(--pastel-blue),
                0 -4px 0 0 var(--pastel-blue),
                0 4px 0 0 var(--pastel-blue);
        }

        .pixel-btn.restart::after {
            background-color: var(--pastel-blue);
        }

        .pixel-btn.restart:hover {
            color: #000;
            box-shadow: 
                -4px 0 0 0 var(--pastel-blue),
                4px 0 0 0 var(--pastel-blue),
                0 -4px 0 0 var(--pastel-blue),
                0 4px 0 0 var(--pastel-blue),
                0 0 20px var(--pastel-blue);
        }

        /* 선택 화살표 (숨겨져 있다가 hover시 등장) */
        .select-arrow {
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: var(--text-white);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .pixel-btn:hover .select-arrow {
            opacity: 1;
            animation: arrowBlink 0.5s infinite;
        }

        @keyframes arrowBlink {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(-5px); }
        }

        /* 데코 요소 */
        .pixel-deco {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--border-color);
        }
        .pd-tl { top: 100px; left: 100px; }
        .pd-tr { top: 100px; right: 100px; }
        .pd-bl { bottom: 100px; left: 100px; }
        .pd-br { bottom: 100px; right: 100px; }

    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-scanlines"></div>
<!-- 데코 픽셀 -->
<div class="pixel-deco pd-tl"></div>
<div class="pixel-deco pd-tr"></div>
<div class="pixel-deco pd-bl"></div>
<div class="pixel-deco pd-br"></div>
<div class="container-frame">
<div class="question-box">
<h1 class="question-text" id="questionText"></h1>
</div>
<div class="button-group" id="btnGroup">
<!-- 네 버튼 -->
<button class="pixel-btn" onclick="endPresentation()">
<i class="fas fa-caret-right select-arrow"></i>
                네
            </button>
<!-- 처음으로 버튼 -->
<button class="pixel-btn restart" onclick="goToFirstSlide()">
<i class="fas fa-caret-right select-arrow"></i>
                처음으로
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const text = "발표를 끝내시겠습니까?";
            const textElement = document.getElementById('questionText');
            const btnGroup = document.getElementById('btnGroup');

            // 1. 타이핑 애니메이션
            textElement.innerHTML = '<span class="cursor-blink"></span>';
            let charIndex = 0;

            function typeWriter() {
                if (charIndex < text.length) {
                    const currentText = text.substring(0, charIndex + 1);
                    textElement.innerHTML = currentText + '<span class="cursor-blink"></span>';
                    charIndex++;
                    setTimeout(typeWriter, 120); // 약간 느리게 타이핑하여 긴장감 조성
                } else {
                    // 타이핑 완료 후 버튼 그룹 등장
                    setTimeout(() => {
                        btnGroup.classList.add('visible');
                    }, 500);
                }
            }

            // 시작
            setTimeout(typeWriter, 800);
        });

        // 기능 함수
        function goToFirstSlide() {
            // 1페이지로 이동 (해시 변경 또는 최상단 스크롤)
            // 실제 프레젠테이션 환경에 맞춰 동작하도록 해시와 스크롤 모두 처리
            try {
                window.location.href = "1.html";
                window.scrollTo(0, 0);
            } catch(e) {
                console.log("Navigation to first slide triggered");
            }
            
            // 시각적 피드백
            document.body.style.transition = "opacity 0.5s";
            document.body.style.opacity = "0";
            setTimeout(() => {
                window.location.reload(); // 리로드하여 처음 상태로 (단순 예시)
            }, 500);
        }

        function endPresentation() {
            // 종료 효과 (화면 꺼짐)
            document.body.style.backgroundColor = "#000";
            document.body.innerHTML = ""; // 모든 요소 제거
            
            // 중앙에 작은 점 하나 남기기 (TV 꺼지는 효과 연출용 - 단순화)
            const dot = document.createElement('div');
            dot.style.position = 'absolute';
            dot.style.top = '50%';
            dot.style.left = '50%';
            dot.style.width = '2px';
            dot.style.height = '2px';
            dot.style.backgroundColor = '#fff';
            dot.style.boxShadow = '0 0 20px #fff';
            document.body.appendChild(dot);
            
            setTimeout(() => {
                dot.style.display = 'none';
            }, 200);
        }
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                window.location.href = "20.html";
            }
        });
    </script>
</body>
</html>
